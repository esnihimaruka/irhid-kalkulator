<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Chassis Body -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="url(#bg)" stroke="#4b5563" stroke-width="12" />

  <!-- LCD Screen -->
  <rect x="64" y="64" width="384" height="110" rx="24" fill="url(#screen)" stroke="#334155" stroke-width="6" />
  <!-- Screen Text -->
  <text x="420" y="140" font-family="monospace, sans-serif" font-weight="900" font-size="52" fill="#38bdf8" text-anchor="end">888,888</text>

  <!-- Multi-colored Buttons Grid -->
  <!-- Row 1 -->
  <rect x="64" y="200" width="80" height="60" rx="16" fill="#e11d48" />
  <rect x="164" y="200" width="80" height="60" rx="16" fill="#f59e0b" />
  <rect x="264" y="200" width="80" height="60" rx="16" fill="#6366f1" />
  <rect x="364" y="200" width="80" height="60" rx="16" fill="#06b6d4" />

  <!-- Row 2 -->
  <rect x="64" y="280" width="80" height="60" rx="16" fill="#84cc16" />
  <rect x="164" y="280" width="80" height="60" rx="16" fill="#0ea5e9" />
  <rect x="264" y="280" width="80" height="60" rx="16" fill="#d946ef" />
  <rect x="364" y="280" width="80" height="60" rx="16" fill="#7c3aed" />

  <!-- Row 3 -->
  <rect x="64" y="360" width="80" height="60" rx="16" fill="#10b981" />
  <rect x="164" y="360" width="80" height="60" rx="16" fill="#facc15" />
  <rect x="264" y="360" width="80" height="60" rx="16" fill="#f97316" />
  <rect x="364" y="360" width="80" height="130" rx="16" fill="url(#accent)" />

  <!-- Row 4 -->
  <rect x="64" y="440" width="180" height="50" rx="16" fill="#ea580c" />
  <rect x="264" y="440" width="80" height="50" rx="16" fill="#a3e635" />

  <!-- Brand Symbol -->
  <circle cx="88" cy="100" r="10" fill="#f59e0b" />
  <text x="110" y="105" font-family="sans-serif" font-weight="900" font-size="14" fill="#94a3b8" letter-spacing="2">HIUKALI</text>
</svg>
